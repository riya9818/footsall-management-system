{% extends "base.html" %}

{% block content %}
<div class="container mt-3">
  <h3>Player Availability – {{ match }}</h3>

  <form method="POST">
    {% csrf_token %}
    <table class="table">
      <tr>
        <th>Player</th>
        <th>Status</th>
      </tr>

      {% for player in players %}
      <tr>
        <td>{{ player.name }}</td>
        <td>
          <select name="status_{{ player.id }}" class="form-control">
            <option value="available">Available</option>
            <option value="maybe">Maybe</option>
            <option value="unavailable">Unavailable</option>
          </select>
        </td>
      </tr>
      {% endfor %}
    </table>

    <button class="btn btn-success">Save Availability</button>
  </form>
</div>
{% endblock %}
