{% extends "base.html" %}

{% block content %}
<div class="container mt-3">
  <h3>Match Attendance – {{ match }}</h3>

  <form method="POST">
    {% csrf_token %}
    <table class="table">
      <tr>
        <th>Player</th>
        <th>Present</th>
      </tr>
       {% for player in players %}
      <tr>
        <td>{{ player.name }}</td>
        <td>
          <input type="checkbox" name="present_{{ player.id }}">
        </td>
      </tr>
      {% endfor %}
    </table>
