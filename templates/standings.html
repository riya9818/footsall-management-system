{% extends "base.html" %}

{% block content %}
<div class="container mt-4">
    <h2 class="mb-3">League Standings</h2>
    <table class="table table-bordered table-striped">
        <thead>
            <tr>
                <th>Team</th>
                <th>P</th>
                <th>W</th>
                <th>D</th>
                <th>L</th>
                <th>GF</th>
                <th>GA</th>
                <th>GD</th>
                <th>PTS</th>
                 </tr>
        </thead>
        
        <tbody>
        {% for team, stats in table %}
            <tr>
                <td>{{ team.name }}</td>
                <td>{{ stats.played }}</td>
                <td>{{ stats.wins }}</td>
                <td>{{ stats.draws }}</td>
                <td>{{ stats.losses }}</td>
                <td>{{ stats.gf }}</td>
                <td>{{ stats.ga }}</td>
                <td>{{ stats.gd }}</td>
                <td><b>{{ stats.points }}</b></td>
            </tr>
        {% endfor %}
        </tbody>
